apiVersion: v1
kind: Service
metadata:
  name: p16-mysql
  namespace: p16
  labels: {app: p16-mysql}
spec:
  clusterIP: None
  selector: {app: p16-mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p16-mysql
  namespace: p16
  labels: {app: p16-mysql}
spec:
  serviceName: p16-mysql
  replicas: 1
  selector: {matchLabels: {app: p16-mysql}}
  template:
    metadata: {labels: {app: p16-mysql}}
    spec:
      containers:
        - name: p16-mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: p16-config}}, {secretRef: {name: p16-secrets}}]
          ports: [{name: mysql, containerPort: 3306}]
          command: ["sh", "-c"]
          args: ["docker-entrypoint.sh mysqld"]
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
          volumeMounts: [{name: p16-mysql-data, mountPath: /var/lib/mysql}]
      volumes:
        - name: p16-mysql-data
          persistentVolumeClaim: {claimName: p16-mysql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: p16-mongo
  namespace: p16
  labels: {app: p16-mongo}
spec:
  clusterIP: None
  selector: {app: p16-mongo}
  ports: [{name: mongo, port: 27017, targetPort: mongo}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p16-mongo
  namespace: p16
  labels: {app: p16-mongo}
spec:
  serviceName: p16-mongo
  replicas: 1
  selector: {matchLabels: {app: p16-mongo}}
  template:
    metadata: {labels: {app: p16-mongo}}
    spec:
      containers:
        - name: p16-mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: p16-config}}, {secretRef: {name: p16-secrets}}]
          ports: [{name: mongo, containerPort: 27017}]
          readinessProbe:
            exec: {command: ["sh", "-c", "mongosh --quiet --host 127.0.0.1 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "mongosh --quiet --host 127.0.0.1 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"]}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
          volumeMounts: [{name: p16-mongo-data, mountPath: /data/db}]
      volumes:
        - name: p16-mongo-data
          persistentVolumeClaim: {claimName: p16-mongo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: p16-kafka
  namespace: p16
  labels: {app: p16-kafka}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: p16-kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p16-kafka
  namespace: p16
  labels: {app: p16-kafka}
spec:
  serviceName: p16-kafka
  replicas: 1
  selector: {matchLabels: {app: p16-kafka}}
  template:
    metadata: {labels: {app: p16-kafka}}
    spec:
      containers:
        - name: p16-kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://p16-kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@p16-kafka:9093}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
          ports: [{name: kafka, containerPort: 9092}]
          readinessProbe:
            exec: {command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]}
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
          volumeMounts: [{name: p16-kafka-data, mountPath: /var/lib/kafka/data}]
      volumes:
        - name: p16-kafka-data
          persistentVolumeClaim: {claimName: p16-kafka-data}
