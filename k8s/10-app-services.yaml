spec:
  replicas: 1
  selector: {matchLabels: {app: p16-frontend}}
  template:
    metadata: {labels: {app: p16-frontend}}
    spec:
      containers:
        - name: p16-frontend
          image: p16-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: p16-frontend
  namespace: p16
  labels: {app: p16-frontend}
spec:
  type: ClusterIP
  selector: {app: p16-frontend}
