apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p16-mysql-data
  namespace: p16
  labels: {app: p16-mysql}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p16-mongo-data
  namespace: p16
  labels: {app: p16-mongo}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p16-kafka-data
  namespace: p16
  labels: {app: p16-kafka}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
