---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p16-student-service
  namespace: p16
  labels: {app: p16-student-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: p16-student-service}}
  template:
    metadata: {labels: {app: p16-student-service}}
    spec:
      containers:
        - name: p16-student-service
          image: p16-student-service:local
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: p16-config}}, {secretRef: {name: p16-secrets}}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: p16-student-service
  namespace: p16
  labels: {app: p16-student-service}
spec:
  type: ClusterIP
  selector: {app: p16-student-service}
  ports: [{name: http, port: 8000, targetPort: http}]
