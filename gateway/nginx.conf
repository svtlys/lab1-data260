events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 10m;
    sendfile on;

    map $http_x_trace_id $p16_trace_id {
        default $http_x_trace_id;
        "" $request_id;
    }

    upstream p16_frontend {
        server p16-frontend:80;
    }

    upstream p16_student_service {
        server p16-student-service:8000;
    }

    upstream p16_company_service {
        server p16-company-service:8000;
    }

    upstream p16_job_service {
        server p16-job-service:8000;
    }

    upstream p16_application_service {
        server p16-application-service:8000;
    }

    upstream p16_event_service {
        server p16-event-service:8000;
    }

    upstream p16_assistant_service {
        server p16-assistant-service:8000;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            default_type application/json;
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"p16-gateway"}';
        }

        # route nested application paths before broader api prefixes
        location ~ ^/api/jobs/[0-9]+/applications(?:/|$) {
            proxy_pass http://p16_application_service;
        }

        location ~ ^/api/students/me/applications(?:/|$) {
            proxy_pass http://p16_application_service;
        }

        location ~ ^/api/companies/me/jobs/[0-9]+/applications(?:/|$) {
            proxy_pass http://p16_application_service;
        }

        location ~ ^/api/companies/me/applications(?:/|$) {
            proxy_pass http://p16_application_service;
        }

        location ~ ^/api/companies/me/events(?:/|$) {
            proxy_pass http://p16_company_service;
        }

        location ~ ^/api/events(?:/|$) {
            proxy_pass http://p16_event_service;
        }

        location ~ ^/api/jobs(?:/|$) {
            proxy_pass http://p16_job_service;
        }

        location ~ ^/api/companies/me/jobs(?:/|$) {
            proxy_pass http://p16_company_service;
        }

        location ~ ^/api/assistant(?:/|$) {
            proxy_pass http://p16_assistant_service;
        }

        location ~ ^/api/companies/profile-images(?:/|$) {
            proxy_pass http://p16_company_service;
        }

        location ~ ^/api/companies(?:/|$) {
            proxy_pass http://p16_company_service;
        }

        location ~ ^/api/auth(?:/|$) {
            proxy_pass http://p16_student_service;
        }

        location ~ ^/api/students(?:/|$) {
            proxy_pass http://p16_student_service;
        }

        location ~ ^/api/ {
            return 404;
        }

        location / {
            proxy_pass http://p16_frontend;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Trace-Id $p16_trace_id;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
