apiVersion: apps/v1
kind: Deployment
metadata:
  name: p16-gateway
  namespace: p16
  labels: {app: p16-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: p16-gateway}}
  template:
    metadata: {labels: {app: p16-gateway}}
    spec:
      containers:
        - name: p16-gateway
          image: p16-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: p16-gateway
  namespace: p16
  labels: {app: p16-gateway}
spec:
  type: ClusterIP
  selector: {app: p16-gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p16-frontend
  namespace: p16
