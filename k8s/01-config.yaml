apiVersion: v1
kind: ConfigMap
metadata:
  name: p16-config
  namespace: p16
data:
  DB_HOST: p16-mysql
  DB_PORT: "3306"
  DB_NAME: p16_handshake
  MYSQL_DATABASE: p16_handshake
  MONGO_HOST: p16-mongo
  MONGO_PORT: "27017"
  MONGO_DATABASE: p16_handshake
  MONGO_READS_ENABLED: "false"
  KAFKA_ENABLED: "false"
  KAFKA_BOOTSTRAP_SERVERS: p16-kafka:9092
  KAFKA_TOPIC_PREFIX: p16
  KAFKA_PARTITIONS: "3"
  KAFKA_REPLICATION_FACTOR: "1"
  KAFKA_TOPICS: >-
    p16.application.created,p16.application.updated,p16.application.status_changed,
    p16.event.registration_created,p16.job.created,p16.memory.consolidate,p16.dlq
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  OLLAMA_MODEL: qwen3:8b
  OLLAMA_TIMEOUT_SECONDS: "120"
  VITE_API_BASE_URL: REPLACE_WITH_BROWSER_GATEWAY_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: p16-secrets
  namespace: p16
type: Opaque
stringData:
  DB_USER: REPLACE_WITH_MYSQL_USER
  DB_PASSWORD: REPLACE_WITH_MYSQL_PASSWORD
  MYSQL_USER: REPLACE_WITH_MYSQL_USER
  MYSQL_PASSWORD: REPLACE_WITH_MYSQL_PASSWORD
  MYSQL_ROOT_PASSWORD: REPLACE_WITH_MYSQL_ROOT_PASSWORD
  JWT_SECRET_KEY: REPLACE_WITH_JWT_SECRET_KEY
  MONGO_USERNAME: REPLACE_WITH_MONGO_USERNAME
  MONGO_PASSWORD: REPLACE_WITH_MONGO_PASSWORD
  MONGO_INITDB_ROOT_USERNAME: REPLACE_WITH_MONGO_USERNAME
  MONGO_INITDB_ROOT_PASSWORD: REPLACE_WITH_MONGO_PASSWORD
